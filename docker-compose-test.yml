services:
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    image: nabham92/projet-final-backend:latest
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DOCKER_ENV=true
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    image: nabham92/projet-final-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - DOCKER_ENV=true
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
